; SCP-914 refinement recipes (Indev)
; These are checked FIRST, for any item, before the built-in recipes.
; Format:
;   [itemname]            (the item's name from items.ini)
;   rough = result        coarse = result      1:1 = result
;   fine = result         very fine = result
; A result is an item name, "destroy" (dust on the floor), or "same" (comes out unchanged).
; List several results with commas and one is picked at random: fine = key2, key3
; Leave a setting out to use the item's normal recipe / the generic refinement.
;
; Items with no recipe anywhere are still refined: Rough breaks them down to dust,
; Coarse makes them "Worn", 1:1 reworks them into another item of the same kind,
; Fine makes them "Refined" then "Pure", Very Fine makes them "Pure" (1 in 5 turns to powder).
;
; Examples (remove the ; to use them):
;[radio]
;very fine = fineradio, veryfineradio
;
;[origami]
;rough = destroy
;1:1 = paper
